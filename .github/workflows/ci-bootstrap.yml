name: CI Bootstrap

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  node-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client (API)
        run: npm run prisma:generate -w apps/api

      - name: Build workspaces
        run: npm run build

      - name: Typecheck workspaces
        run: npm run typecheck

  python-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI dependencies
        run: pip install -r apps/ai/requirements.txt

      - name: Validate Python package syntax
        run: python -m compileall apps/ai/app

