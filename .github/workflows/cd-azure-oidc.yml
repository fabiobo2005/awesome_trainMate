name: CD Azure OIDC

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      environment:
        description: azd environment name
        type: string
        default: dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-azure-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_ENV_NAME: ${{ github.event.inputs.environment || 'dev' }}
  AZURE_LOCATION: canadacentral

jobs:
  provision-deploy:
    name: Provision and deploy via azd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_PRINCIPAL_ID: ${{ vars.AZURE_PRINCIPAL_ID }}
        run: |
          set -euo pipefail
          required=(AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_PRINCIPAL_ID)
          for v in "${required[@]}"; do
            if [ -z "${!v:-}" ]; then
              echo "Missing repository variable: $v" >&2
              exit 1
            fi
          done

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Azure login (OIDC)
        run: |
          azd auth login \
            --client-id "${{ vars.AZURE_CLIENT_ID }}" \
            --federated-credential-provider github \
            --tenant-id "${{ vars.AZURE_TENANT_ID }}"

      - name: Set azd env config
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_PRINCIPAL_ID: ${{ vars.AZURE_PRINCIPAL_ID }}
        run: |
          azd env new "$AZURE_ENV_NAME" --location "$AZURE_LOCATION" --subscription "$AZURE_SUBSCRIPTION_ID" --no-prompt || \
            azd env select "$AZURE_ENV_NAME"
          azd env set AZURE_PRINCIPAL_ID "$AZURE_PRINCIPAL_ID"

      - name: Provision (Bicep)
        run: azd provision --no-prompt

      - name: Deploy services
        run: azd deploy --no-prompt

      - name: Show endpoints
        run: |
          API_URL=$(azd env get-values | grep '^AZURE_API_BASE_URL=' | cut -d= -f2- | tr -d '"')
          AI_URL=$(azd env get-values | grep '^AZURE_AI_BASE_URL=' | cut -d= -f2- | tr -d '"')
          WEB_URL=$(azd env get-values | grep '^AZURE_WEB_HOSTNAME=' | cut -d= -f2- | tr -d '"')
          {
            echo "## Deploy concluído"
            echo ""
            echo "| Serviço | URL |"
            echo "|---|---|"
            echo "| Frontend | https://$WEB_URL |"
            echo "| API | $API_URL |"
            echo "| AI | $AI_URL |"
          } >> "$GITHUB_STEP_SUMMARY"
